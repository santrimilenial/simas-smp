<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Offline - Jurnal Mengajar</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .container {
                background: white;
                border-radius: 20px;
                padding: 40px;
                text-align: center;
                max-width: 400px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            }

            .icon {
                width: 100px;
                height: 100px;
                margin: 0 auto 20px;
                background: #f3f4f6;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .icon svg {
                width: 50px;
                height: 50px;
                fill: #6b7280;
            }

            h1 {
                color: #1f2937;
                font-size: 24px;
                margin-bottom: 10px;
            }

            p {
                color: #6b7280;
                font-size: 16px;
                line-height: 1.6;
                margin-bottom: 30px;
            }

            .btn {
                display: inline-block;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 12px 30px;
                border-radius: 30px;
                text-decoration: none;
                font-weight: 600;
                transition: transform 0.2s, box-shadow 0.2s;
            }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            }

            .status {
                margin-top: 30px;
                padding: 15px;
                background: #fef3c7;
                border-radius: 10px;
                color: #92400e;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l10.08 12.56c.8 1 2.32 1 3.12 0L23.64 7z"
                        opacity="0.3"
                    />
                    <path
                        d="M12 3C5.28 3 .81 6.66.36 7l10.08 12.56c.8 1 2.32 1 3.12 0L23.64 7c-.45-.34-4.93-4-11.64-4zm0 16L2.92 8.37C4.85 7.09 8.13 5 12 5s7.15 2.09 9.08 3.37L12 19z"
                    />
                    <line
                        x1="2"
                        y1="2"
                        x2="22"
                        y2="22"
                        stroke="#6b7280"
                        stroke-width="2"
                    />
                </svg>
            </div>

            <h1>Anda Sedang Offline</h1>
            <p>
                Koneksi internet tidak tersedia. Beberapa fitur mungkin tidak
                dapat diakses saat ini.
            </p>

            <a
                href="/"
                class="btn"
                onclick="window.location.reload(); return false;"
                >Coba Lagi</a
            >

            <div class="status">
                <strong>💡 Tips:</strong> Periksa koneksi WiFi atau data seluler
                Anda, lalu coba lagi.
            </div>
        </div>

        <script>
            // Auto reload when back online
            window.addEventListener("online", () => {
                window.location.reload();
            });
        </script>
    </body>
</html>
